# PRODUCTION (reviewer plan 2026-10-03): prod500_vsolv_fix setting + charge-state inputs to the 3-D solvent head + unified
# full-field repair (forbidden-zone cancellation of the 1-D background, per-layer conservation in the allowed region). 500 epochs, same seed / split / lr / weights / warm-up / EMA.
name: "prod500_chargeinput_repair"
model: "PolarMACE"
device: "cuda"
default_dtype: "float64"
seed: 123

train_file: "./data/train.xyz"
test_file: "./data/test.xyz"
valid_file: "./data/val.xyz"

energy_key: "energy"
forces_key: "forces"
charges_key: "REF_charges"
atomic_dipole_key: "atomic_dipole"
potential_key: "potential_diff"
fermi_level_key: "Fermi"
total_charge_key: "total_charge"
total_spin_key: "total_spin"
sample_id_key: "sample_id"

hidden_irreps: "64x0e + 64x1o + 64x2e"
r_max: 5.0
E0s: "average"
config_type_weights: '{"NiN":1.0}'
atomic_multipoles_max_l: 2
atomic_multipoles_smearing_width: 0.5
atomic_density_sigmas: "[0.25, 0.5, 1.0]"
atomic_valence_electrons: "[1.0, 4.0, 5.0, 6.0, 10.0]"
field_feature_max_l: 1
num_recursion_steps: 1

loss: "energy_forces_electrostatics"
batch_size: 1
valid_batch_size: 1
max_num_epochs: 500
restart_latest: False
amsgrad: True
ema: True
ema_decay: 0.99
swa: False
lr: 0.01

energy_weight: 1000.0
forces_weight: 100.0
atomic_dipole_weight: 0.0
charges_weight: 0.0
potential_weight: 0.00001
fermi_level_weight: 1.0
density_3d_weight: 1.0
density_3d_signal_ms: 4.693372e-3
density_3d_file: "./data/density3d_net_grid_manifest_npy.json"
density_3d_sigma: "[0.25, 0.5, 1.0]"
density_3d_samples: 1024
density_3d_seed: 123
potential_1d_profile_weight: 1.0
potential_1d_profile_file: "./data/potential1d_potcar_cache.npz"
potential_1d_profile_align: "upper"
potential_1d_profile_use_solvent_profile: True
solvent_center_weight: 0.0

element_charge_baseline: False
element_charge_residual_scale: None

solvent_model: "pb1d"
solvent_pb_config: "./cal1_train.json"
solvent_pb_repo: "/work/08384/tg876840/ls6/repos/cep-dip-python-pb"
solvent_pb_grid_spacing: 0.15
solvent_pb_fixsol_steps: 5
solvent_pb_tol: 0.001
solvent_pb_baseline_cache: "./data/baseline_cache"

solvent_sigma_g: 0.85
solvent_density_threshold: 0.15
solvent_window_inward: 4.0
solvent_window_outward: 4.0
solvent_potential_axis: 2
solvent_potential_sign: -1.0

potential_axis: 2
potential_sign: -1

distributed: true
static_shard_sampler: False

solvent_pb_phi_cache_dir: "./cache"
solvent_pb1d_zones: 8
solvent_pb1d_sigma_z: 0.2
solvent_pb1d_c_max: 0.25
solvent_pb1d_upsample: 2
solvent_pb1d_max_outer: 12
solvent_pb1d_warmup_encounters: 20
solvent_pb1d_fresh_stage1: True
num_workers: 2

solvent_rhob_1d_weight: 1.0
solvent_rhob_1d_file: "./data/dft_solvent1d_ref.npz"
solvent_rhob_1d_sigma: 0.15
solvent_rhob_1d_smear_ref: False

charge_density_1d_file: "./data/density1d_net_cache.npz"
charge_density_1d_weight: 1.0

occ_aug_file: "./data/occ_aug_cache_800.npz"
occ_aug_weight: 1.0

# --- this experiment: residual-3D solvent charge supervision ---
solvent3d_head: True
solvent3d_weight: 1.0
solvent3d_file: "./data/solvent3d_points_manifest.json"
solvent3d_samples: 1024
solvent3d_sigmas: "[0.5, 1.0, 2.0]"

# stage-2 gate: neutral fix + energy terms + rolling ckpt (pb-s3d-energy)
solvent3d_energy: True
solvent_cavity_energy: True
save_latest_every: 0

# bound the head null-direction drift (gate_fix measured: |W| 1.6 after one
# PB epoch -> ~5 e*A spurious dipole -> 5 V eval potential poisoning)
solvent3d_head_weight_decay: 1.0e-2

# gate_le: + the NATIVE local_electron_energy head, enabled and trained
# (upstream channel, add_local_electron_energy; it was OFF in the gate_bl run)
add_local_electron_energy: True

# gate_bl: + baseline-coupling energy (audit 2026-09-08, in-model validated)
solvent_baseline_coupling: True

save_all_checkpoints: True   # per-epoch EMA checkpoints for the structural evaluation

# 2026-09-22 (user): first-stage solvent effective-potential input (v_cav + v_diel + v_ion) ON
solvent_pb1d_vsolv_input: True

# --- 2026-10-03 reviewer plan: charge-state inputs + unified full-field repair (NEW; the only changes vs prod500_vsolv_fix) ---
solvent3d_charge_state_input: True      # [f, s1 f, s2 f, s3 f] -> zero-initialised augmented linear readout (init: zeros)
solvent3d_ion_gate: False               # no global net-charge multiplication of the ion channel
solvent3d_repair: True                  # rho_new = M rho + (M/Mbar)[B(z) - mean(M rho)] (kept layers); M rho on layers with Mbar <= min_layer
solvent3d_mask_sigma: 0.25              # A, Gaussian smoothing of the model cavity function before the threshold
solvent3d_mask_t0: 1.0e-4               # fully forbidden below (smoothed cavity value)
solvent3d_mask_t1: 1.0e-2               # fully allowed above; C2 quintic transition in log10 between t0 and t1
solvent3d_mask_min_layer: 1.0e-3
# training-set standardisation of (Q, phi_1D(z_a), q_a): s3d_scal_stats.json, job 3486208, baseline model, 480 solvated training frames / 120480 atoms
solvent3d_scal_mean: "[-0.795029, -9.220073, -0.002902]"
solvent3d_scal_std: "[0.50287, 9.419123, 0.102076]"
